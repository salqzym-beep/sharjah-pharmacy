<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>صيدلية الشارقة</title>
<style>
:root{--green:#e8effa;--green-dark:#315d9d;--blue:#345bb0;--white:#fff;--ink:#20212a}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#eaf1fb 0%,#dce8f8 52%,#f0e9fb 100%);color:var(--ink);min-height:100dvh}
.app{min-height:100dvh;padding:10px 18px 130px;display:flex;flex-direction:column;align-items:center}
h1{position:sticky;top:0;z-index:12;width:100%;background:#eaf1fb;color:#2f4f83;font-size:clamp(34px,8vw,62px);font-weight:800;text-align:center;margin:0 0 10px;padding:8px 0;line-height:1.15;text-shadow:0 1px 1px #ffffff20;user-select:none}
.searchbar{position:sticky;top:74px;z-index:11;width:100%;max-width:720px;background:white;border:4px solid #d7e2e0;border-radius:27px;height:100px;display:flex;align-items:center;padding:12px 14px;gap:14px;box-shadow:0 2px 5px #00000012}
.searchbar input{border:0;outline:0;min-width:0;flex:1;font-size:22px;background:transparent;text-align:right;padding:0 10px;color:#333}
.searchbar input::placeholder{color:#999}
.searchbtn,.filterbtn{height:66px;width:66px;border:0;border-radius:18px;display:grid;place-items:center;cursor:pointer}
.searchbtn{background:var(--blue);color:white}
.filterbtn{background:#f0effb;color:#303b70}
svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#content{width:100%;max-width:720px;flex:1;margin-top:22px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 10px #16452a18;border:1px solid #e8edf4}
.product img{width:100%;height:132px;max-width:100%;object-fit:contain;display:block;border-radius:12px;background:#f8fafc}
.product h3{margin:7px 0;font-size:17px}
.product p{margin:5px 0;color:#555}
.product button{background:var(--green-dark);color:white;border:0;border-radius:10px;padding:9px 12px;font-size:15px;cursor:pointer}
.bottomnav{position:fixed;z-index:5;bottom:18px;left:2.5%;width:95%;max-width:760px;background:white;border-radius:45px;min-height:174px;display:flex;align-items:center;justify-content:space-around;padding:12px 8px;box-shadow:0 6px 20px #174a2c18}
.navitem{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-width:0;flex:1;color:#858585;border:0;background:transparent;font-family:inherit;cursor:pointer;font-size:17px}
.navitem svg{width:55px;height:55px;color:#111;stroke-width:1.5}
.navitem.active{color:var(--green-dark);font-weight:bold}
.navitem.active svg{color:var(--green-dark);fill:var(--green-dark);stroke-width:1.8}
.cartdot{position:absolute;top:-1px;right:34%;width:24px;height:24px;background:#e84949;border-radius:50%;box-shadow:0 1px 3px #0002}
.section-title{color:#315d9d;font-weight:800;font-size:23px;margin:0 0 12px}
.empty{min-height:40vh}
.panel{background:#fff;border-radius:20px;padding:18px;margin:16px auto;max-width:720px;width:100%}
.panel h2{margin:0 0 15px;color:var(--green-dark)}
.panel input,.panel select,.panel textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font:inherit}
.panel button{border:0;border-radius:10px;padding:11px 15px;margin:5px;background:var(--green-dark);color:#fff;font:inherit;cursor:pointer}
.panel button.danger{background:#c0392b}
.contact-link{display:inline-block;text-decoration:none}
.contact-link button{background:#18865a!important;color:#fff!important}
.panel .fieldlabel{display:block;margin-top:8px;font-weight:bold}
.accountform,.checkoutform{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 10px #16452a12}
.accountform input,.checkoutform input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font:inherit}
.accountform button,.checkoutform button{background:var(--green-dark);color:white;border:0;border-radius:10px;padding:12px 16px;margin:5px;font:inherit;cursor:pointer;font-weight:bold}
.cart-actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.cart-actions button{flex:1;min-width:140px;border:0;border-radius:14px;padding:13px 14px;font:inherit;font-weight:bold;cursor:pointer}
.btn-buy{background:#18865a!important;color:#fff!important}
.btn-secondary{background:#edf1fb!important;color:#315d9d!important;border:1px solid #d0dcf2!important}
.ordercard{background:#fff;border-radius:16px;padding:14px;margin:12px 0}
.stages{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.stage{padding:7px 9px;border-radius:9px;background:#e8e8e8;color:#666;font-size:13px}
.stage.done{background:#18865a;color:white}
.banner-carousel{width:100%;max-width:440px;margin:16px auto 24px;position:relative;overflow:hidden;border-radius:24px;background:#fff;box-shadow:0 8px 22px #355b8b20;aspect-ratio:1/1;flex:0 0 auto}
.banner-carousel .banner-slide{position:absolute;inset:0;opacity:0;animation:bannerFade 16s infinite}
.banner-carousel .banner-slide img{width:100%;height:100%;object-fit:cover;display:block}
.banner-carousel .banner-caption{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#172c50a8);color:white;padding:18px 14px 12px;font-weight:bold}
@keyframes bannerFade{0%,22%{opacity:1}25%,97%{opacity:0}100%{opacity:1}}
.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0;touch-action:pan-y;overscroll-behavior:contain}
.category-tile{touch-action:pan-y;background:#fff;border:1px solid #e4eaf3;border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 14px #315d9d12;cursor:pointer;color:#2f4f83;font:inherit;font-weight:700;min-height:142px}
.category-tile img{width:76px;height:76px;object-fit:contain;border-radius:16px;background:#f4f7fc;padding:5px}
.category-emoji{width:76px;height:76px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(135deg,#eef4ff,#f4eefe);font-size:42px}
html,body{overflow-x:hidden;touch-action:pan-y}
@media(max-width:480px){.app{padding:0 18px 125px}h1{font-size:clamp(32px,8vw,44px);margin-bottom:8px;padding:8px 0}.searchbar{height:88px;top:62px}.searchbtn,.filterbtn{height:58px;width:58px}.bottomnav{min-height:150px;bottom:18px}.navitem{font-size:14px}.navitem svg{width:42px;height:42px}}
@media(max-width:360px){.category-grid{gap:8px}.category-tile{padding:8px}.category-tile img,.category-emoji{width:64px;height:64px}}
</style>
</head>
<body>
<div class="app">
  <h1 id="brand">صيدلية الشارقة</h1>
  <div class="searchbar">
    <button class="filterbtn" id="filterBtn" aria-label="الأقسام" onclick="showSections()"><svg viewBox="0 0 24 24"><path d="M4 6h7M15 6h5M4 12h3M11 12h9M4 18h9M17 18h3"/><path d="M13 3v6M9 9v6M15 15v6"/></svg></button>
    <input id="search" placeholder="ابحث عن اسم المنتج أو القسم..." aria-label="بحث عن المنتجات" oninput="onSearchInput()">
    <button class="searchbtn" aria-label="بحث" onclick="onSearchInput()"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
  </div>
  <section id="homeBanners" class="banner-carousel" style="display:none"></section>
  <main id="content"><div class="panel">جاري تحميل بيانات المتجر...</div></main>
</div>
<nav class="bottomnav" aria-label="التنقل">
  <button class="navitem" onclick="setTab('address',this)">
    <svg viewBox="0 0 48 48"><path d="M24 44s16-15 16-26A16 16 0 0 0 8 18c0 11 16 26 16 26Z"/><circle cx="24" cy="18" r="5"/></svg><span>العنوان</span>
  </button>
  <button class="navitem" onclick="setTab('sections',this)">
    <svg viewBox="0 0 48 48"><rect x="4" y="4" width="15" height="15" rx="3"/><rect x="29" y="4" width="15" height="15" rx="3"/><rect x="4" y="29" width="15" height="15" rx="3"/><circle cx="36.5" cy="36.5" r="7.5"/></svg><span>أقسام</span>
  </button>
  <button class="navitem active" onclick="setTab('home',this)">
    <svg viewBox="0 0 48 48"><path d="M4 22 24 5l20 17M10 19v25h28V19M19 44V29h10v15" /></svg><span>الرئيسية</span>
  </button>
  <button class="navitem" onclick="setTab('cart',this)">
    <span class="cartdot" id="cartdot"></span>
    <svg viewBox="0 0 48 48"><path d="M4 7h5l5 25h25l5-19H12M18 18h21M15 27h23M18 39a3 3 0 1 0 0 6 3 3 0 0 0 0-6M36 39a3 3 0 1 0 0 6 3 3 0 0 0 0-6"/></svg><span>السلة</span>
  </button>
  <button class="navitem" onclick="setTab('account',this)">
    <svg viewBox="0 0 48 48"><circle cx="24" cy="13" r="9"/><path d="M15 12c4 3 9 2 13-2M8 43v-5c0-8 7-13 16-13s16 5 16 13v5M16 28l8 10 8-10M20 38l-2 5M28 38l2 5"/></svg><span>حسابي</span>
  </button>
</nav>

<script>
const defaultCategories=['أدوية','العناية بطفل','العناية بالأم','أدوات تجميل'];
const categoryEmoji={'أدوية':'💊','العناية بطفل':'🧸','العناية بالأم':'🤱','أدوات تجميل':'💄'};
let categoryArt={};
let products=[];
let settings={brand:'صيدلية الشارقة',address:'',phone:'',whatsappEnabled:false};
let categories=[...defaultCategories];
let banners=[];
let orders=[];
let cart=JSON.parse(localStorage.getItem('sharjah_cart')||'[]');
let loggedCustomer=localStorage.getItem('sharjah_logged_customer')||'';
let customerProfile=JSON.parse(localStorage.getItem('sharjah_customer_profile')||'null');
let currentTab='home',selectedCategory='',showCheckoutBox=false;
const brand=document.getElementById('brand');

function persistLocal(key,val){localStorage.setItem(key,JSON.stringify(val));}

function compressImageFile(file,maxSide=900,quality=.75){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')){reject(new Error('يرجى اختيار ملف صورة'));return;}
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('الصورة غير صالحة'));
      img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/webp',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadCompressedImageToBlob(file,maxSide=900,quality=.75){
  const dataUrl=await compressImageFile(file,maxSide,quality);
  const blob=await (await fetch(dataUrl)).blob();
  const formData=new FormData();
  formData.append('file',blob,'proof.webp');
  const response=await fetch('/api/upload',{method:'POST',body:formData});
  let result={};try{result=await response.json();}catch(_){}
  if(!response.ok||!result.url)throw new Error(result.error||'فشل رفع الصورة إلى السحابة');
  return result.url;
}

async function loadStoreFromCloud(notify=false){
  try{
    const res=await fetch('/api/store',{cache:'no-store'});
    if(!res.ok)throw new Error('تعذر تحميل البيانات');
    const data=await res.json();
    products=data.products||[];
    categories=data.categories||defaultCategories;
    categoryArt=data.categoryArt||{};
    banners=data.banners||[];
    settings=data.settings||settings;
    orders=data.orders||[];
    brand.textContent=settings.brand||'صيدلية الشارقة';
    document.title=settings.brand||'صيدلية الشارقة';
    renderProducts();
    if(notify)alert('تم تحديث البيانات بنجاح');
  }catch(e){
    console.error(e);
    renderProducts();
  }
}

function categoryVisual(name){
  const image=categoryArt[name];
  if(image)return '<img src="'+escapeAttr(image)+'" alt="'+escapeAttr(name)+'">';
  return '<span class="category-emoji">'+(categoryEmoji[name]||'🧴')+'</span>';
}

function normalizeSearch(value){
  return String(value||'').toLowerCase()
    .normalize('NFD').replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/\s+/g,' ').trim();
}

function renderHomeBanners(){
  const el=document.getElementById('homeBanners');if(!el)return;
  el.innerHTML='';
  const list=banners.slice(0,4);
  const totalSec=Math.max(4,list.length*4);
  list.forEach((b,i)=>{
    const slide=document.createElement('div');
    slide.className='banner-slide';
    slide.style.animationDuration=totalSec+'s';
    slide.style.animationDelay=(i*4)+'s';
    const img=document.createElement('img');
    img.src=b.image;img.alt=b.title||'إعلان';
    slide.append(img);
    if(b.title){
      const cap=document.createElement('div');
      cap.className='banner-caption';cap.textContent=b.title;
      slide.append(cap);
    }
    el.append(slide);
  });
}

const stageNames=['مراجعة','تم الطلب','تم التنفيذ','تم التسليم'];
function renderStages(stage){
  let index=stageNames.indexOf(stage);
  return '<div class="stages">'+stageNames.map((s,i)=>'<span class="stage '+(i<=index?'done':'')+'">'+s+'</span>').join('')+'</div>';
}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return escapeHtml(s);}

function productCard(p){
  return '<article class="product">'+(p.image?'<img src="'+escapeAttr(p.image)+'" alt="">':'')+'<h3>'+escapeHtml(p.name)+'</h3><p>'+escapeHtml(p.category)+'</p><p><b>'+p.price+'</b></p><button onclick="addCart('+p.id+')">+ شراء / أضف للسلة</button></article>';
}

function addCart(id){
  cart.push(id);
  persistLocal('sharjah_cart',cart);
  document.getElementById('cartdot').style.display='block';
  showCheckoutBox=false;
  const cartNav=document.querySelectorAll('.navitem')[3];
  setTab('cart',cartNav);
}

function removeFromCart(index){
  cart.splice(index,1);
  persistLocal('sharjah_cart',cart);
  document.getElementById('cartdot').style.display=cart.length?'block':'none';
  if(!cart.length)showCheckoutBox=false;
  renderProducts();
}

function startCheckout(){
  showCheckoutBox=true;
  renderProducts();
  setTimeout(()=>{
    const box=document.getElementById('cartCheckoutSection');
    if(box)box.scrollIntoView({behavior:'smooth'});
  },50);
}

function continueShopping(){
  showCheckoutBox=false;
  setTab('home',document.querySelectorAll('.navitem')[2]);
}

function authFormsHtml(stayInCart=false){
  return '<div class="accountform"><h3>تسجيل الدخول</h3><input id="loginUsername" placeholder="اسم المستخدم"><input id="loginPassword" type="password" placeholder="كلمة المرور"><button onclick="customerLogin('+stayInCart+')">دخول</button><p id="customerError" style="color:#c0392b"></p></div><div class="accountform"><h3>إنشاء حساب جديد</h3><input id="newCustomerName" placeholder="اسم العميل"><input id="newCustomerPhone" type="tel" placeholder="جواله"><input id="newCustomerUsername" placeholder="اسم المستخدم"><input id="newCustomerPassword" type="password" placeholder="كلمة المرور"><button onclick="createCustomer('+stayInCart+')">حفظ / إنشاء حساب</button></div>';
}

function onSearchInput(){
  const q=document.getElementById('search').value.trim();
  if(q && currentTab!=='home'){
    currentTab='home';
    document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
    document.querySelectorAll('.navitem')[2].classList.add('active');
  }
  renderProducts();
}

function renderProducts(){
  const content=document.getElementById('content');
  const q=normalizeSearch(document.getElementById('search').value);
  const bannerEl=document.getElementById('homeBanners');
  if(bannerEl){
    const show=(currentTab==='home'&&banners.length>0&&!q);
    bannerEl.style.display=show?'block':'none';
    if(show)renderHomeBanners();
  }
  if(currentTab==='sections'){
    content.innerHTML='<h2 class="section-title">الأقسام</h2><div class="category-grid">'+
      categories.map((c,i)=>'<button type="button" class="category-tile" onclick="openCategoryIndex('+i+')">'+categoryVisual(c)+'<span>'+escapeHtml(c)+'</span></button>').join('')+
      '</div>';
    if(!categories.length)content.innerHTML+='<div class="panel">لا توجد أقسام مضافة حالياً.</div>';
    return;
  }
  if(currentTab==='category'){
    const wanted=normalizeSearch(selectedCategory);
    const selected=products.filter(p=>{
      const productCategory=p.category||p.section||p.categoryName||p.group||'';
      const actual=normalizeSearch(productCategory);
      return actual===wanted || (actual && wanted && (actual.includes(wanted)||wanted.includes(actual)));
    });
    content.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px"><h2 class="section-title" style="margin:0">'+escapeHtml(selectedCategory)+'</h2><button type="button" onclick="backToSections()" style="border:0;border-radius:12px;padding:10px 14px;background:#315d9d;color:#fff;font:inherit;cursor:pointer">رجوع للأقسام</button></div>'+
      (selected.length?'<div class="products">'+selected.map(productCard).join('')+'</div>':'<div class="panel">لا توجد منتجات في هذا القسم حتى الآن.</div>');
    return;
  }
  if(currentTab==='cart'){
    const chosen=cart.map((id,idx)=>({p:products.find(x=>x.id===id),idx})).filter(x=>x.p);
    let html='<h2 class="section-title">السلة</h2>';
    if(!chosen.length){
      html+='<div class="panel">السلة فارغة. أضف منتجات من الرئيسية أو الأقسام.<br><button onclick="continueShopping()" style="margin-top:10px">تصفح المنتجات</button></div>';
      content.innerHTML=html;
      return;
    }
    const total=chosen.reduce((sum,x)=>sum+Number(x.p.price||0),0);
    html+='<div class="products">'+chosen.map(({p,idx})=>'<article class="product">'+(p.image?'<img src="'+escapeAttr(p.image)+'" alt="">':'')+'<h3>'+escapeHtml(p.name)+'</h3><p><b>'+p.price+'</b></p><button style="background:#c0392b" onclick="removeFromCart('+idx+')">إزالة</button></article>').join('')+'</div>';
    html+='<div class="panel" style="margin-top:14px;text-align:center"><b>الإجمالي: '+total+'</b></div>';
    html+='<div class="cart-actions">'+
          '<button class="btn-buy" onclick="startCheckout()">شراء / إتمام الطلب</button>'+
          '<button class="btn-secondary" onclick="continueShopping()">+ إضافة منتجات أخرى</button>'+
          '<button class="btn-secondary" onclick="loadStoreFromCloud(true)">⟳ تحديث</button>'+
          '</div>';

    if(showCheckoutBox){
      html+='<div id="cartCheckoutSection">';
      if(loggedCustomer && customerProfile){
        html+='<div class="checkoutform"><h3>إتمام الشراء ('+escapeHtml(customerProfile.name)+')</h3><input id="checkoutLocation" placeholder="موقع العميل بالتفصيل (مثلاً: المكلا، شارع ...)"><label class="fieldlabel">صورة سند الدفع</label><input id="checkoutProof" type="file" accept="image/*"><button class="btn-buy" id="submitOrderBtn" onclick="submitOrder()">تأكيد وإرسال الطلب</button></div>';
      }else{
        html+='<div class="panel"><p style="color:#315d9d;font-weight:bold;margin:0">لإكمال الشراء، يرجى تسجيل الدخول أو إنشاء حساب جديد:</p></div>'+authFormsHtml(true);
      }
      html+='</div>';
    }
    content.innerHTML=html;
    return;
  }
  if(currentTab==='address'){
    const phone=String(settings.phone||'').replace(/[^0-9]/g,'');
    const whatsapp=phone?(phone.startsWith('967')?phone:'967'+phone):'';
    content.innerHTML='<h2 class="section-title">العنوان وبيانات التواصل</h2><div class="panel"><h2>'+escapeHtml(settings.brand||'صيدلية الشارقة')+'</h2><p><b>العنوان:</b> '+escapeHtml(settings.address||'لم يتم إضافة العنوان بعد')+'</p><p><b>رقم الجوال / الهاتف:</b> '+escapeHtml(settings.phone||'لم يتم إضافة رقم الهاتف بعد')+'</p>'+(settings.phone?'<a class="contact-link" href="tel:'+escapeAttr(settings.phone)+'"><button>اتصال</button></a>':'')+(settings.whatsappEnabled&&whatsapp?'<a class="contact-link" target="_blank" rel="noopener" href="https://wa.me/'+whatsapp+'"><button>تواصل عبر واتساب</button></a>':'')+'</div>';
    return;
  }
  if(currentTab==='account'){renderAccount(content);return;}
  const filtered=q?products.filter(p=>normalizeSearch((p.name||'')+' '+(p.category||p.section||p.categoryName||p.group||'')).includes(q)):products.filter(p=>p.featured);
  content.innerHTML=filtered.length?'<div class="products">'+filtered.map(productCard).join('')+'</div>':'<div class="panel">'+(q?'لا توجد منتجات تطابق البحث.':'لا توجد منتجات محددة للعرض في الرئيسية بعد.')+'</div>';
}

function openCategoryIndex(index){
  const category=categories[index];
  if(!category)return;
  selectedCategory=category;
  document.getElementById('search').value='';
  currentTab='category';
  document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  const sectionsNav=[...document.querySelectorAll('.navitem')].find(n=>n.textContent.includes('أقسام'));
  if(sectionsNav)sectionsNav.classList.add('active');
  renderProducts();
}

function backToSections(){currentTab='sections';renderProducts();}

function setTab(tab,el){
  currentTab=tab;
  document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  if(tab==='account'||tab==='sections')loadStoreFromCloud();
  renderProducts();
}

function showSections(){
  currentTab='sections';
  document.querySelectorAll('.navitem').forEach(n=>n.classList.remove('active'));
  const sectionsNav=[...document.querySelectorAll('.navitem')].find(n=>n.textContent.includes('أقسام'));
  if(sectionsNav)sectionsNav.classList.add('active');
  loadStoreFromCloud();
  renderProducts();
}

function renderAccount(content){
  if(loggedCustomer && customerProfile){
    content.innerHTML='<h2 class="section-title">حسابي</h2><div class="accountform"><h3>مرحباً '+escapeHtml(customerProfile.name)+'</h3><p>الجوال: '+escapeHtml(customerProfile.phone)+'</p><button onclick="logoutCustomer()">تسجيل الخروج</button></div><h3 class="section-title">طلباتي</h3>';
    let mine=orders.filter(o=>o.username===loggedCustomer).slice().reverse();
    content.innerHTML+=mine.length?mine.map(o=>'<div class="ordercard"><b>طلب #'+o.id+'</b><p>'+escapeHtml(o.items)+'</p><p>الحالة: '+escapeHtml(o.status)+'</p>'+renderStages(o.status)+'</div>').join(''):'<div class="panel">لا توجد طلبات مسجلة.</div>';
    return;
  }
  content.innerHTML='<h2 class="section-title">حسابي</h2>'+authFormsHtml(false);
}

async function customerLogin(stayInCart=false){
  const username=document.getElementById('loginUsername').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!username||!password){document.getElementById('customerError').textContent='أدخل اسم المستخدم وكلمة المرور';return;}
  try{
    const res=await fetch('/api/store',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'customer_login',payload:{username,password}})
    });
    const data=await res.json();
    if(!res.ok){document.getElementById('customerError').textContent=data.error||'بيانات الدخول غير صحيحة';return;}
    loggedCustomer=data.customer.username;
    customerProfile=data.customer;
    localStorage.setItem('sharjah_logged_customer',loggedCustomer);
    persistLocal('sharjah_customer_profile',customerProfile);
    if(stayInCart)showCheckoutBox=true;
    await loadStoreFromCloud();
  }catch(e){
    document.getElementById('customerError').textContent='خطأ في الاتصال بالسيرفر';
  }
}

async function createCustomer(stayInCart=false){
  const name=document.getElementById('newCustomerName').value.trim();
  const phone=document.getElementById('newCustomerPhone').value.trim();
  const username=document.getElementById('newCustomerUsername').value.trim();
  const password=document.getElementById('newCustomerPassword').value;
  if(!name||!phone||!username||!password){alert('أكمل جميع البيانات');return;}
  try{
    const res=await fetch('/api/store',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'customer_register',payload:{name,phone,username,password}})
    });
    const data=await res.json();
    if(!res.ok){alert(data.error||'تعذر إنشاء الحساب');return;}
    loggedCustomer=data.customer.username;
    customerProfile=data.customer;
    localStorage.setItem('sharjah_logged_customer',loggedCustomer);
    persistLocal('sharjah_customer_profile',customerProfile);
    if(stayInCart)showCheckoutBox=true;
    alert('تم إنشاء الحساب وتسجيل الدخول بنجاح');
    renderProducts();
  }catch(e){
    alert('خطأ في الاتصال بالسيرفر');
  }
}

function logoutCustomer(){
  loggedCustomer='';
  customerProfile=null;
  localStorage.removeItem('sharjah_logged_customer');
  localStorage.removeItem('sharjah_customer_profile');
  renderProducts();
}

async function submitOrder(){
  if(!loggedCustomer||!customerProfile){
    showCheckoutBox=true;
    renderProducts();
    return;
  }
  const location=document.getElementById('checkoutLocation').value.trim();
  const file=document.getElementById('checkoutProof').files[0];
  if(!location){alert('أدخل موقع العميل بالتفصيل');return;}
  if(!file){alert('أرفق صورة سند الدفع');return;}
  if(!file.type.startsWith('image/')){alert('الملف يجب أن يكون صورة');return;}

  const btn=document.getElementById('submitOrderBtn');
  if(btn){btn.disabled=true;btn.textContent='جاري رفع السند وإرسال الطلب...';}

  try{
    const proofUrl=await uploadCompressedImageToBlob(file,900,.75);
    const chosen=cart.map(id=>products.find(p=>p.id===id)).filter(Boolean);
    const items=chosen.map(p=>p.name+' ×1 ('+p.price+')').join('، ');
    const newOrder={
      id:Date.now(),
      username:customerProfile.username,
      customerName:customerProfile.name,
      phone:customerProfile.phone,
      location,
      proof:proofUrl,
      items,
      status:'مراجعة',
      createdAt:new Date().toISOString()
    };
    const res=await fetch('/api/store',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'create_order',payload:newOrder})
    });
    if(!res.ok)throw new Error('فشل إرسال الطلب');
    orders.push(newOrder);
    cart=[];
    showCheckoutBox=false;
    persistLocal('sharjah_cart',cart);
    document.getElementById('cartdot').style.display='none';
    alert('تم إرسال طلبك بنجاح: قيد المراجعة');
    renderProducts();
  }catch(e){
    alert(e.message||'حدث خطأ أثناء إرسال الطلب');
    if(btn){btn.disabled=false;btn.textContent='تأكيد وإرسال الطلب';}
  }
}

document.getElementById('cartdot').style.display=cart.length?'block':'none';
loadStoreFromCloud();
</script>
</body>
</html>
