<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>لوحة تحكم صيدلية الشارقة</title>
<style>
:root{--green:#e8effa;--green-dark:#315d9d;--blue:#345bb0;--white:#fff;--ink:#20212a}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eaf2f8;color:var(--ink);min-height:100dvh}
svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.panel{background:#fff;border-radius:20px;padding:18px;margin:16px auto;max-width:720px;width:100%}
.panel h2{margin:0 0 15px;color:var(--green-dark)}
.panel input,.panel select,.panel textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font:inherit}
.panel button{border:0;border-radius:10px;padding:11px 15px;margin:5px;background:var(--green-dark);color:#fff;font:inherit;cursor:pointer}
.panel button.danger{background:#c0392b}
.adminrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:10px 0}
.ordercard{background:#f9fbfd;border:1px solid #e1e8f0;border-radius:16px;padding:14px;margin:12px 0}
.stages{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.stage{padding:7px 9px;border-radius:9px;background:#e8e8e8;color:#666;font-size:13px}
.stage.done{background:#18865a;color:white}
.ordercard img.proof{max-width:100%;max-height:220px;object-fit:contain;display:block;margin:8px 0;border-radius:10px;border:1px solid #ddd}
.banner-admin-card{display:flex;align-items:center;gap:10px;border:1px solid #e1e6ee;border-radius:16px;padding:10px;margin:10px 0}
.banner-admin-card img{width:82px;height:60px;object-fit:cover;border-radius:10px}
.banner-admin-card span{flex:1;font-weight:bold}
#adminOverlay{display:block;position:relative;min-height:100dvh;background:#eaf2f8;padding:14px}
#adminOverlay .panel#adminPanel{max-width:760px;margin:24px auto;background:#fff;border-radius:38px;padding:28px 24px 34px;box-shadow:0 10px 30px #203c5510;color:#26354a}
#adminPanel h2{font-size:clamp(25px,5vw,34px);color:#2d4058;text-align:right;margin:0 0 12px}
#adminPanel h3{font-size:22px;color:#26354a;margin:28px 0 14px}
#adminPanel label{display:block;color:#666;font-size:17px;margin:18px 0 7px}
#adminPanel input:not([type=file]),#adminPanel select,#adminPanel textarea{width:100%;height:70px;padding:15px 18px;margin:7px 0 12px;border:2px solid #e0e4e8;border-radius:20px;background:#fff;font:inherit;font-size:19px}
#adminPanel input[type=file]{width:100%;padding:18px;border:2px solid #e0e4e8;border-radius:20px;margin:7px 0 12px;font:inherit}
#adminPanel button{border:0;border-radius:20px;padding:17px 22px;margin:5px;background:#edf1fb;color:#36558e;font:inherit;font-size:18px;cursor:pointer}
#adminPanel button.danger{background:#d94b4b;color:white}
#adminPanel button.primary{background:#315d9d;color:#fff}
.admin-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.admin-toolbar button{flex:1;min-width:115px}
.admin-status{display:inline-block;background:#e8f4ed;color:#23744f;border-radius:25px;padding:9px 18px;margin:0 0 10px;font-weight:bold}
.admin-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0 25px}
.admin-tabs button{min-height:68px;margin:0!important}
.admin-tabs button.selected{background:#315d9d!important;color:white!important}
.admin-section{border-top:1px solid #e8e8e8;padding-top:20px;margin-top:20px}
#adminProducts .adminrow{border:1px solid #e2e5e9;border-radius:22px;padding:16px;margin:12px 0;flex-wrap:wrap}
#adminProducts .adminrow span{font-weight:bold;color:#2d4058}
#adminProducts .adminrow button{padding:12px 18px}
.category-emoji{width:60px;height:60px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#eef4ff,#f4eefe);font-size:30px}
.category-admin-preview{width:60px;height:60px;object-fit:contain;border-radius:12px;background:#f4f7fc;padding:4px}
@media(max-width:480px){#adminOverlay{padding:8px}#adminOverlay .panel#adminPanel{padding:22px 18px 30px;border-radius:32px;margin:10px auto}#adminPanel input:not([type=file]),#adminPanel select{height:66px}.admin-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="adminOverlay">
  <section class="panel" id="loginPanel">
    <h2>دخول لوحة التحكم</h2>
    <p><a href="./index.html" style="color:#315d9d;text-decoration:none;font-weight:bold">← العودة إلى المتجر</a></p>
    <input id="adminPass" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')loginAdmin()">
    <button onclick="loginAdmin()">تسجيل الدخول</button>
    <button class="danger" onclick="closeAdmin()">إغلاق</button>
    <p id="loginError" style="color:#c0392b"></p>
  </section>

  <section class="panel" id="adminPanel" style="display:none">
    <h2 id="adminHeaderTitle">لوحة تحكم صيدلية الشارقة</h2>
    <div class="admin-status" id="syncStatus">✓ متصل بـ Vercel Blob</div>
    <div class="admin-toolbar">
      <button onclick="closeAdmin()">عرض المتجر ↗</button>
      <button onclick="refreshAdmin()">⟳ تحديث البيانات</button>
      <button class="danger" onclick="logoutAdmin()">تسجيل خروج</button>
    </div>
    <div class="admin-tabs">
      <button class="selected" onclick="adminJump('productSection',this)">المنتجات</button>
      <button onclick="adminJump('categorySection',this)">الأقسام</button>
      <button onclick="adminJump('bannerSection',this)">صور الإعلان</button>
      <button onclick="adminJump('customerSection',this)">العملاء</button>
      <button onclick="adminJump('orderSection',this)">الطلبات</button>
      <button onclick="adminJump('settingsSection',this)">الإعدادات</button>
    </div>

    <div class="admin-section" id="settingsSection">
      <h3>إعدادات الصيدلية والتواصل</h3>
      <label>اسم الصيدلية</label><input id="adminBrand" value="صيدلية الشارقة">
      <label>العنوان التفصيلي للصيدلية</label><input id="adminAddress" placeholder="مثلاً: المكلا، شارع ...">
      <label>رقم الجوال / الهاتف</label><input id="adminPhone" type="tel" placeholder="أدخل رقم الهاتف">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input id="adminWhatsappEnabled" type="checkbox" style="width:22px;height:22px"> تفعيل زر واتساب</label>
      <button class="primary" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>

    <div class="admin-section" id="productSection">
      <h3>إضافة / تعديل منتج</h3>
      <input id="prodName" placeholder="اسم المنتج">
      <input id="prodPrice" type="number" min="0" placeholder="السعر">
      <label>القسم</label><select id="prodCategory"></select>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input id="prodFeatured" type="checkbox" style="width:22px;height:22px"> عرض المنتج في الرئيسية</label>
      <label>صورة المنتج (تُضغط وتُرفع تلقائياً إلى Vercel Blob)</label>
      <input id="prodImageFile" type="file" accept="image/*">
      <input id="prodImage" type="url" placeholder="أو رابط صورة المنتج (اختياري)">
      <button class="primary" id="saveProdBtn" onclick="saveProduct()">حفظ المنتج</button>
      <button class="danger" onclick="clearProductForm()">إلغاء التعديل</button>
      <h3>المنتجات المضافة</h3>
      <div id="adminProducts"></div>
    </div>

    <div class="admin-section" id="categorySection">
      <h3>إدارة الأقسام</h3>
      <input id="newCategory" placeholder="اسم القسم الجديد">
      <label>صورة القسم (اختياري — تُضغط وتُرفع تلقائياً)</label>
      <input id="newCategoryImage" type="file" accept="image/*">
      <button class="primary" id="addCatBtn" onclick="addCategory()">إضافة قسم</button>
      <div id="adminCategories"></div>
    </div>

    <div class="admin-section" id="bannerSection">
      <h3>صور الإعلان الرئيسية (حتى 4 صور)</h3>
      <p>تظهر الصور المتحركة في الرئيسية فقط.</p>
      <input id="bannerImageFile" type="file" accept="image/*">
      <input id="bannerImageTitle" placeholder="عنوان الصورة (اختياري)">
      <button class="primary" id="saveBannerBtn" onclick="saveBanner()">إضافة صورة / حفظ التعديل</button>
      <button onclick="cancelBannerEdit()">إلغاء التعديل</button>
      <div id="adminBanners"></div>
    </div>

    <div class="admin-section" id="customerSection">
      <h3>حسابات العملاء المسجلين</h3>
      <div id="adminCustomers"></div>
    </div>

    <div class="admin-section" id="orderSection">
      <h3>طلبات العملاء ومراحلها</h3>
      <div id="adminOrders"></div>
    </div>

    <button class="danger" onclick="closeAdmin()">العودة للمتجر</button>
  </section>
</div>

<script>
const defaultCategories=['أدوية','العناية بطفل','العناية بالأم','أدوات تجميل'];
const categoryEmoji={'أدوية':'💊','العناية بطفل':'🧸','العناية بالأم':'🤱','أدوات تجميل':'💄'};
let categoryArt={};
let products=[];
let settings={brand:'صيدلية الشارقة',address:'',phone:'',whatsappEnabled:false};
let customers=[];
let orders=[];
let categories=[...defaultCategories];
let banners=[];
let editingBannerIndex=null;
let editId=null;
let adminToken=sessionStorage.getItem('sharjah_admin_pass')||'';

function setSyncStatus(text,isError=false){
  const el=document.getElementById('syncStatus');
  if(!el)return;
  el.textContent=text;
  el.style.background=isError?'#fdecea':'#e8f4ed';
  el.style.color=isError?'#c0392b':'#23744f';
}

function compressImageFile(file,maxSide=640,quality=.72){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')){reject(new Error('يرجى اختيار ملف صورة'));return;}
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('تعذر قراءة الصورة'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('الصورة غير صالحة'));
      img.onload=()=>{
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/webp',quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadCompressedImageToBlob(file,maxSide=640,quality=.72){
  setSyncStatus('⏳ جاري رفع الصورة إلى Vercel Blob...');
  const dataUrl=await compressImageFile(file,maxSide,quality);
  const blob=await (await fetch(dataUrl)).blob();
  const formData=new FormData();
  formData.append('file',blob,'image.webp');
  const response=await fetch('/api/upload',{method:'POST',body:formData});
  let result={};try{result=await response.json();}catch(_){}
  if(!response.ok||!result.url){
    setSyncStatus('✕ فشل رفع الصورة',true);
    throw new Error(result.error||'فشل رفع الصورة إلى Vercel Blob');
  }
  return result.url;
}

async function syncStoreToBlob(){
  setSyncStatus('⏳ جاري الحفظ في السحابة...');
  const res=await fetch('/api/store',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      action:'admin_save',
      password:adminToken,
      payload:{products,categories,categoryArt,banners,settings,customers,orders}
    })
  });
  if(!res.ok){
    setSyncStatus('✕ فشل الحفظ في السحابة',true);
    const err=await res.json().catch(()=>({}));
    throw new Error(err.error||'فشل حفظ التعديلات في Vercel Blob');
  }
  setSyncStatus('✓ محفوظ ومتزامن مع Vercel Blob');
}

function closeAdmin(){window.location.href='./index.html';}

function logoutAdmin(){
  sessionStorage.removeItem('sharjah_admin_pass');
  adminToken='';
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('loginPanel').style.display='block';
  document.getElementById('adminPass').value='';
}

async function loginAdmin(autoPass){
  const pass=(autoPass||document.getElementById('adminPass').value).trim();
  if(!pass){document.getElementById('loginError').textContent='أدخل كلمة المرور';return;}
  document.getElementById('loginError').textContent='جاري التحقق وتحميل البيانات...';
  try{
    const res=await fetch('/api/store',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'admin_login',password:pass})
    });
    const data=await res.json();
    if(!res.ok){
      sessionStorage.removeItem('sharjah_admin_pass');
      document.getElementById('loginError').textContent=data.error||'كلمة المرور غير صحيحة';
      return;
    }
    adminToken=pass;
    sessionStorage.setItem('sharjah_admin_pass',pass);
    document.getElementById('loginError').textContent='';
    applyStoreData(data.store);
    document.getElementById('loginPanel').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    setSyncStatus('✓ متصل بـ Vercel Blob');
  }catch(e){
    document.getElementById('loginError').textContent='خطأ في الاتصال بالسيرفر';
  }
}

function applyStoreData(store){
  products=store.products||[];
  categories=store.categories||defaultCategories;
  categoryArt=store.categoryArt||{};
  banners=store.banners||[];
  settings=store.settings||settings;
  customers=store.customers||[];
  orders=store.orders||[];

  document.getElementById('adminHeaderTitle').textContent='لوحة تحكم '+(settings.brand||'صيدلية الشارقة');
  document.getElementById('adminBrand').value=settings.brand||'صيدلية الشارقة';
  document.getElementById('adminAddress').value=settings.address||'';
  document.getElementById('adminPhone').value=settings.phone||'';
  document.getElementById('adminWhatsappEnabled').checked=!!settings.whatsappEnabled;

  renderAdminProducts();
  renderAdminCategories();
  renderAdminCustomers();
  renderAdminOrders();
  renderAdminBanners();
  populateProductCategories();
}

async function refreshAdmin(){
  await loginAdmin(adminToken);
  alert('تم تحديث البيانات من السحابة.');
}

async function saveSettings(){
  settings={
    brand:document.getElementById('adminBrand').value.trim()||'صيدلية الشارقة',
    address:document.getElementById('adminAddress').value.trim(),
    phone:document.getElementById('adminPhone').value.trim(),
    whatsappEnabled:document.getElementById('adminWhatsappEnabled').checked
  };
  try{
    await syncStoreToBlob();
    document.getElementById('adminHeaderTitle').textContent='لوحة تحكم '+settings.brand;
    alert('تم حفظ الإعدادات في السحابة');
  }catch(e){alert(e.message);}
}

function populateProductCategories(selected){
  const sel=document.getElementById('prodCategory');
  if(!sel)return;
  sel.innerHTML='';
  if(!categories.length){
    const opt=document.createElement('option');opt.value='';opt.textContent='أضف قسمًا أولاً';sel.append(opt);return;
  }
  categories.forEach(c=>{
    const opt=document.createElement('option');opt.value=c;opt.textContent=c;sel.append(opt);
  });
  if(selected && categories.includes(selected))sel.value=selected;
}

async function saveProduct(){
  const name=document.getElementById('prodName').value.trim();
  const price=document.getElementById('prodPrice').value;
  const category=document.getElementById('prodCategory').value||categories[0]||'عام';
  let image=document.getElementById('prodImage').value.trim();
  const file=document.getElementById('prodImageFile').files[0];
  const featured=document.getElementById('prodFeatured').checked;
  if(!name||price===''){alert('أدخل اسم المنتج والسعر');return;}
  if(!categories.length){alert('أضف قسمًا من لوحة التحكم أولاً');return;}
  const btn=document.getElementById('saveProdBtn');
  if(btn)btn.disabled=true;
  try{
    if(file)image=await uploadCompressedImageToBlob(file,640,.72);
    if(editId!==null)products=products.map(p=>p.id===editId?{...p,name,price:Number(price),category,image,featured}:p);
    else products.push({id:Date.now(),name,price:Number(price),category,image,featured});
    await syncStoreToBlob();
    clearProductForm();
    renderAdminProducts();
  }catch(e){
    alert(e.message||'تعذر حفظ المنتج');
  }finally{
    if(btn)btn.disabled=false;
  }
}

function clearProductForm(){
  editId=null;
  ['prodName','prodPrice','prodImage'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('prodImageFile').value='';
  document.getElementById('prodFeatured').checked=false;
  populateProductCategories();
}

function editProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  editId=id;
  document.getElementById('prodName').value=p.name;
  document.getElementById('prodPrice').value=p.price;
  populateProductCategories(p.category);
  document.getElementById('prodImage').value=p.image||'';
  document.getElementById('prodImageFile').value='';
  document.getElementById('prodFeatured').checked=!!p.featured;
  document.getElementById('productSection').scrollIntoView({behavior:'smooth'});
}

async function deleteProduct(id){
  if(!confirm('حذف هذا المنتج؟'))return;
  products=products.filter(p=>p.id!==id);
  try{await syncStoreToBlob();renderAdminProducts();}catch(e){alert(e.message);}
}

function renderAdminProducts(){
  let box=document.getElementById('adminProducts');
  box.innerHTML=products.length?'':'<p>لا توجد منتجات مضافة.</p>';
  products.forEach(p=>{
    let row=document.createElement('div');row.className='adminrow';
    let info=document.createElement('span');
    info.textContent=p.name+' — '+p.price+' ('+p.category+')'+(p.featured?' ★ الرئيسية':'');
    let actions=document.createElement('div');
    let e=document.createElement('button');e.textContent='تعديل';e.onclick=()=>editProduct(p.id);
    let d=document.createElement('button');d.textContent='حذف';d.className='danger';d.onclick=()=>deleteProduct(p.id);
    actions.append(e,d);row.append(info,actions);box.append(row);
  });
}

async function addCategory(){
  const name=document.getElementById('newCategory').value.trim();
  const file=document.getElementById('newCategoryImage').files[0];
  if(!name){alert('أدخل اسم القسم');return;}
  if(categories.includes(name)){alert('القسم موجود بالفعل');return;}
  const btn=document.getElementById('addCatBtn');
  if(btn)btn.disabled=true;
  try{
    if(file)categoryArt[name]=await uploadCompressedImageToBlob(file,400,.70);
    categories.push(name);
    await syncStoreToBlob();
    document.getElementById('newCategory').value='';
    document.getElementById('newCategoryImage').value='';
    renderAdminCategories();
    populateProductCategories();
  }catch(e){
    alert(e.message||'تعذر إضافة القسم');
  }finally{
    if(btn)btn.disabled=false;
  }
}

async function deleteCategory(name){
  if(!confirm('حذف القسم؟ المنتجات الموجودة فيه ستبقى محفوظة.'))return;
  categories=categories.filter(c=>c!==name);
  delete categoryArt[name];
  try{
    await syncStoreToBlob();
    renderAdminCategories();
    populateProductCategories();
  }catch(e){alert(e.message);}
}

function renderAdminCategories(){
  const box=document.getElementById('adminCategories');if(!box)return;box.innerHTML='';
  categories.forEach(c=>{
    const row=document.createElement('div');row.className='adminrow';
    let preview;
    if(categoryArt[c]){preview=document.createElement('img');preview.className='category-admin-preview';preview.src=categoryArt[c];preview.alt=c;}
    else{preview=document.createElement('span');preview.className='category-emoji';preview.textContent=categoryEmoji[c]||'🧴';}
    const label=document.createElement('span');label.textContent=c;
    const edit=document.createElement('button');edit.textContent='تعديل الاسم / الصورة';edit.onclick=()=>editCategory(c);
    const btn=document.createElement('button');btn.className='danger';btn.textContent='حذف';btn.onclick=()=>deleteCategory(c);
    row.append(preview,label,edit,btn);box.append(row);
  });
}

async function editCategory(oldName){
  const newName=prompt('اسم القسم:',oldName);if(newName===null)return;
  const name=newName.trim();if(!name){alert('اسم القسم لا يمكن أن يكون فارغًا');return;}
  if(name!==oldName&&categories.includes(name)){alert('يوجد قسم بهذا الاسم');return;}
  const input=document.createElement('input');input.type='file';input.accept='image/*';
  const chooseImage=confirm('هل تريد تغيير صورة القسم؟ اضغط موافق لاختيار صورة، أو إلغاء للاحتفاظ بالصورة الحالية.');
  let image=categoryArt[oldName];
  if(chooseImage){
    const selected=await new Promise(resolve=>{input.onchange=()=>resolve(input.files[0]||null);input.click();});
    if(selected){try{image=await uploadCompressedImageToBlob(selected,400,.70);}catch(e){alert(e.message);return;}}
  }
  categories=categories.map(c=>c===oldName?name:c);
  if(image)categoryArt[name]=image;else delete categoryArt[name];
  if(name!==oldName)delete categoryArt[oldName];
  products=products.map(p=>p.category===oldName?{...p,category:name}:p);
  try{
    await syncStoreToBlob();
    renderAdminCategories();
    renderAdminProducts();
    populateProductCategories(name);
  }catch(e){alert(e.message);}
}

async function saveBanner(){
  const file=document.getElementById('bannerImageFile').files[0];
  const title=document.getElementById('bannerImageTitle').value.trim();
  if(editingBannerIndex===null && banners.length>=4){alert('الحد الأقصى 4 صور إعلانية. عدّل أو احذف صورة أولاً.');return;}
  if(!file && editingBannerIndex===null){alert('اختر صورة الإعلان');return;}
  const btn=document.getElementById('saveBannerBtn');
  if(btn)btn.disabled=true;
  try{
    if(file){
      const imageUrl=await uploadCompressedImageToBlob(file,1200,.78);
      const item={image:imageUrl,title};
      if(editingBannerIndex!==null)banners[editingBannerIndex]=item;else banners.push(item);
    }else{
      banners[editingBannerIndex].title=title;
    }
    await syncStoreToBlob();
    cancelBannerEdit();
    renderAdminBanners();
  }catch(e){
    alert(e.message);
  }finally{
    if(btn)btn.disabled=false;
  }
}

function editBanner(i){
  editingBannerIndex=i;
  document.getElementById('bannerImageTitle').value=banners[i].title||'';
  document.getElementById('bannerImageFile').value='';
}

function cancelBannerEdit(){
  editingBannerIndex=null;
  const file=document.getElementById('bannerImageFile');if(file)file.value='';
  const title=document.getElementById('bannerImageTitle');if(title)title.value='';
}

async function deleteBanner(i){
  if(!confirm('حذف صورة الإعلان؟'))return;
  banners.splice(i,1);
  try{await syncStoreToBlob();renderAdminBanners();}catch(e){alert(e.message);}
}

function renderAdminBanners(){
  const box=document.getElementById('adminBanners');if(!box)return;box.innerHTML='';
  if(!banners.length){box.innerHTML='<p>لا توجد صور إعلانية بعد.</p>';return;}
  banners.slice(0,4).forEach((b,i)=>{
    const row=document.createElement('div');row.className='banner-admin-card';
    const img=document.createElement('img');img.src=b.image;img.alt='';
    const label=document.createElement('span');label.textContent=(i+1)+'. '+(b.title||'صورة إعلان');
    const edit=document.createElement('button');edit.textContent='تعديل';edit.onclick=()=>editBanner(i);
    const del=document.createElement('button');del.className='danger';del.textContent='حذف';del.onclick=()=>deleteBanner(i);
    row.append(img,label,edit,del);box.append(row);
  });
}

function renderAdminCustomers(){
  let box=document.getElementById('adminCustomers');if(!box)return;
  box.innerHTML=customers.length?'':'<p>لا توجد حسابات عملاء مسجلة بعد.</p>';
  customers.forEach(c=>{
    let row=document.createElement('div');row.className='adminrow';
    let span=document.createElement('span');span.textContent=c.name+' | '+c.phone+' | '+c.username;
    let btn=document.createElement('button');btn.className='danger';btn.textContent='حذف الحساب';
    btn.onclick=async()=>{
      if(!confirm('حذف حساب العميل؟'))return;
      customers=customers.filter(x=>x.username!==c.username);
      try{await syncStoreToBlob();renderAdminCustomers();}catch(e){alert(e.message);}
    };
    row.append(span,btn);box.append(row);
  });
}

const stageNames=['مراجعة','تم الطلب','تم التنفيذ','تم التسليم'];
function renderStages(stage){
  let index=stageNames.indexOf(stage);
  return '<div class="stages">'+stageNames.map((s,i)=>'<span class="stage '+(i<=index?'done':'')+'">'+s+'</span>').join('')+'</div>';
}

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderAdminOrders(){
  let box=document.getElementById('adminOrders');if(!box)return;
  box.innerHTML=orders.length?'':'<p>لا توجد طلبات بعد.</p>';
  orders.slice().reverse().forEach(o=>{
    let card=document.createElement('div');card.className='ordercard';
    card.innerHTML='<b>طلب #'+o.id+'</b><p>العميل: '+escapeHtml(o.customerName)+' — '+escapeHtml(o.phone)+'</p><p>الموقع: '+escapeHtml(o.location)+'</p><p>المنتجات: '+escapeHtml(o.items)+'</p><p>السند:</p>'+(o.proof?'<a href="'+escapeHtml(o.proof)+'" target="_blank"><img class="proof" src="'+escapeHtml(o.proof)+'" alt="صورة السند"></a>':'<p>لم ترفق صورة</p>')+renderStages(o.status);
    let buttons=document.createElement('div');
    stageNames.forEach((s,i)=>{
      let b=document.createElement('button');b.textContent=s;
      b.disabled=i<=stageNames.indexOf(o.status);
      b.onclick=async()=>{
        o.status=s;
        try{await syncStoreToBlob();renderAdminOrders();}catch(e){alert(e.message);}
      };
      buttons.append(b);
    });
    let del=document.createElement('button');del.className='danger';del.textContent='حذف الطلب';
    del.onclick=async()=>{
      if(!confirm('حذف الطلب؟'))return;
      orders=orders.filter(x=>x.id!==o.id);
      try{await syncStoreToBlob();renderAdminOrders();}catch(e){alert(e.message);}
    };
    card.append(buttons,del);box.append(card);
  });
}

function adminJump(id,button){
  const target=document.getElementById(id);
  if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
  document.querySelectorAll('.admin-tabs button').forEach(b=>b.classList.remove('selected'));
  if(button)button.classList.add('selected');
}

if(adminToken)loginAdmin(adminToken);
</script>
